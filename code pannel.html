<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Scorecard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffdad6",
                        "surface-container-low": "#191c1e",
                        "on-tertiary-fixed": "#0d1c2f",
                        "error": "#ffb4ab",
                        "secondary-fixed-dim": "#4ae176",
                        "tertiary": "#b9c7e0",
                        "on-secondary-container": "#004119",
                        "primary-fixed-dim": "#bec6e0",
                        "on-primary": "#283044",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#3f465c",
                        "inverse-primary": "#565e74",
                        "secondary-fixed": "#6bff8f",
                        "background": "#101415",
                        "inverse-surface": "#e0e3e5",
                        "on-primary-container": "#798098",
                        "tertiary-fixed-dim": "#b9c7e0",
                        "on-secondary-fixed": "#002109",
                        "tertiary-fixed": "#d5e3fd",
                        "on-secondary": "#003915",
                        "secondary": "#4ae176",
                        "tertiary-container": "#09182a",
                        "on-primary-fixed": "#131b2e",
                        "on-tertiary": "#233144",
                        "outline": "#909097",
                        "surface-container": "#1d2022",
                        "surface": "#101415",
                        "surface-variant": "#323537",
                        "on-secondary-fixed-variant": "#005321",
                        "on-tertiary-fixed-variant": "#3a485c",
                        "surface-container-lowest": "#0b0f10",
                        "outline-variant": "#45464d",
                        "on-background": "#e0e3e5",
                        "on-surface": "#e0e3e5",
                        "surface-bright": "#363a3b",
                        "primary": "#bec6e0",
                        "on-tertiary-container": "#738298",
                        "primary-fixed": "#dae2fd",
                        "on-surface-variant": "#c6c6cd",
                        "surface-container-high": "#272a2c",
                        "secondary-container": "#00b954",
                        "primary-container": "#0f172a",
                        "surface-container-highest": "#323537",
                        "surface-dim": "#101415",
                        "inverse-on-surface": "#2d3133",
                        "surface-tint": "#bec6e0",
                        "error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "lg": "24px",
                        "sm": "8px",
                        "xl": "48px",
                        "unit": "4px",
                        "md": "16px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "stats-number": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-bold": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "stats-number": ["20px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                },
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pt-16 pb-20">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-surface dark:bg-surface border-b border-outline-variant shadow-sm z-50 h-16 flex justify-between items-center px-margin-mobile md:px-margin-desktop">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95 duration-150 p-2 rounded-full">
<span class="material-symbols-outlined">sports_cricket</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary">Match Center</h1>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95 duration-150 p-2 rounded-full">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<main class="flex-grow p-margin-mobile flex flex-col gap-md max-w-2xl mx-auto w-full mt-4">
<!-- Live Score Display -->
<section class="bg-surface-container rounded-xl p-md border border-outline-variant/30 flex flex-col items-center justify-center relative overflow-hidden shadow-[0_4px_6px_-1px_rgba(0,0,0,0.3)]">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-[#22c55e]"></div>
<div class="flex items-center gap-2 mb-2">
<div class="w-2 h-2 rounded-full bg-[#22c55e] animate-pulse"></div>
<span class="font-label-bold text-label-bold text-[#22c55e]">LIVE</span>
</div>
<div class="text-center">
<h2 class="text-on-surface-variant font-body-md mb-1">TEAM A</h2>
<div class="font-display-lg text-display-lg text-on-surface tracking-tight mb-2">
                    145<span class="text-primary/70">/4</span>
</div>
<div class="font-headline-md text-headline-md text-primary">
                    16.4 <span class="text-on-surface-variant text-body-md font-normal">Overs</span>
</div>
<div class="text-on-surface-variant mt-2 font-label-bold text-label-bold">
                    CRR: 8.70 • REQ: 9.5
                </div>
</div>
</section>
<!-- Over Log -->
<section class="bg-surface-container-low rounded-lg p-sm border border-outline-variant/50">
<div class="flex items-center justify-start gap-2 overflow-x-auto pb-2 scrollbar-hide">
<span class="font-label-bold text-label-bold text-on-surface-variant shrink-0 mr-2">This Over:</span>
<div class="flex gap-2">
<span class="w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center font-label-bold text-label-bold">1</span>
<span class="w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center font-label-bold text-label-bold">0</span>
<span class="w-8 h-8 rounded-full bg-[#22c55e] text-[#101415] flex items-center justify-center font-label-bold text-label-bold">4</span>
<span class="w-8 h-8 rounded-full bg-error text-on-error flex items-center justify-center font-label-bold text-label-bold">W</span>
</div>
</div>
</section>
<!-- Active Players -->
<section class="grid grid-cols-2 gap-md">
<div class="bg-surface-container rounded-lg p-sm border border-outline-variant/30 relative">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-[#22c55e] rounded-l-lg"></div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1 ml-2">Striker *</label>
<select class="w-full bg-surface-container-highest text-on-surface border border-outline-variant rounded-md py-2 px-3 focus:border-[#22c55e] focus:ring-0 font-body-md ml-2">
<option>V. Kohli (45)</option>
<option>R. Sharma</option>
</select>
</div>
<div class="bg-surface-container rounded-lg p-sm border border-outline-variant/30">
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1">Non-Striker</label>
<select class="w-full bg-surface-container-highest text-on-surface border border-outline-variant rounded-md py-2 px-3 focus:border-[#22c55e] focus:ring-0 font-body-md">
<option>S. Yadav (12)</option>
<option>H. Pandya</option>
</select>
</div>
<div class="bg-surface-container rounded-lg p-sm border border-outline-variant/30 col-span-2">
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-1">Bowler</label>
<select class="w-full bg-surface-container-highest text-on-surface border border-outline-variant rounded-md py-2 px-3 focus:border-[#22c55e] focus:ring-0 font-body-md">
<option>T. Boult (2-1-14-1)</option>
<option>M. Santner</option>
</select>
</div>
</section>
<!-- Scoring Buttons -->
<section class="grid grid-cols-4 gap-2 mt-2">
<button class="bg-surface-container-highest hover:bg-surface-variant border border-outline-variant text-on-surface rounded-lg py-4 font-headline-md text-headline-md active:scale-95 transition-all">0</button>
<button class="bg-surface-container-highest hover:bg-surface-variant border border-outline-variant text-on-surface rounded-lg py-4 font-headline-md text-headline-md active:scale-95 transition-all">1</button>
<button class="bg-surface-container-highest hover:bg-surface-variant border border-outline-variant text-on-surface rounded-lg py-4 font-headline-md text-headline-md active:scale-95 transition-all">2</button>
<button class="bg-surface-container-highest hover:bg-surface-variant border border-outline-variant text-on-surface rounded-lg py-4 font-headline-md text-headline-md active:scale-95 transition-all">3</button>
<button class="bg-[#22c55e] hover:bg-[#22c55e]/90 text-[#101415] rounded-lg py-4 font-headline-md text-headline-md active:scale-95 transition-all">4</button>
<button class="bg-[#22c55e] hover:bg-[#22c55e]/90 text-[#101415] rounded-lg py-4 font-headline-md text-headline-md active:scale-95 transition-all">6</button>
<button class="bg-error hover:bg-error/90 text-on-error rounded-lg py-4 font-headline-md text-headline-md active:scale-95 transition-all col-span-2">W</button>
<button class="bg-surface-container-highest hover:bg-surface-variant border border-outline-variant text-on-surface rounded-lg py-3 font-label-bold text-label-bold active:scale-95 transition-all">WD</button>
<button class="bg-surface-container-highest hover:bg-surface-variant border border-outline-variant text-on-surface rounded-lg py-3 font-label-bold text-label-bold active:scale-95 transition-all">NB</button>
<button class="bg-surface-container-highest hover:bg-surface-variant border border-outline-variant text-on-surface rounded-lg py-3 font-label-bold text-label-bold active:scale-95 transition-all">B</button>
<button class="bg-surface-container-highest hover:bg-surface-variant border border-outline-variant text-on-surface rounded-lg py-3 font-label-bold text-label-bold active:scale-95 transition-all">LB</button>
</section>
<!-- Action Bar -->
<section class="flex justify-between items-center mt-4 border-t border-outline-variant/30 pt-4">
<button class="flex items-center gap-1 text-on-surface-variant hover:text-primary transition-colors p-2">
<span class="material-symbols-outlined text-[20px]">undo</span>
<span class="font-label-bold text-label-bold">Undo</span>
</button>
<button class="border border-[#334155] text-on-surface hover:bg-surface-variant rounded-md px-4 py-2 font-label-bold text-label-bold transition-all">
                End Innings
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 pb-safe px-4 bg-surface-container dark:bg-surface-container border-t border-outline-variant shadow-lg rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:text-secondary transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">settings_suggest</span>
<span class="font-label-bold text-label-bold mt-1">Setup</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-container text-on-secondary-container dark:text-on-secondary-container rounded-full px-5 py-1 hover:text-secondary transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">analytics</span>
<span class="font-label-bold text-label-bold mt-1">Scorecard</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:text-secondary transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">layers</span>
<span class="font-label-bold text-label-bold mt-1">Overlay</span>
</button>
</nav>
</body></html>
