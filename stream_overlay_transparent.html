<script>
        // Mocking real-time sync for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const miniBadge = document.getElementById('mini-badge');
            const resultCard = document.getElementById('result-card');
            
            // Example of how a listener might work
            function handleStateChange(state) {
                if (state.matchStatus === 'FINISHED') {
                    resultCard.classList.remove('hidden');
                    resultCard.classList.add('flex');
                    // In a real scenario, you'd hide the main scorebar or swap to mini-badge
                    miniBadge.classList.remove('opacity-0');
                }
            }

            // Simulate match finishing after a few seconds for demo purposes
            setTimeout(() => {
                // handleStateChange({ matchStatus: 'FINISHED' });
            }, 5000);
        });
